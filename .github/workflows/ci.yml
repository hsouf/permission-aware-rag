name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hr"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      PA_RAG_DATABASE_URL: postgresql://rag_gateway:rag_gateway_dev@localhost:5433/hr
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply database schema, roles and RLS policies
        run: psql postgresql://postgres:postgres@localhost:5433/hr -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Adversarial retrieval suite
        run: pytest tests/adversarial -v
      - name: Full suite with coverage (includes Postgres RLS tests)
        run: pytest --cov --cov-report=term --cov-fail-under=85
